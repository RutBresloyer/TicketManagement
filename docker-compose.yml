# Local development SQL Server for the Request Management demo.
# The official image is AMD64-only. On Apple Silicon it runs under emulation
# (Rosetta / QEMU); see README "SQL Server on ARM hosts".
# The SA password comes from .env (gitignored; copy .env.example) and is never committed.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: rm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      # Bound to loopback only so the dev database is not reachable from the network.
      - "127.0.0.1:${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - rm-sqlserver-data:/var/opt/mssql
    healthcheck:
      # SQLCMDPASSWORD keeps the password off the process command line.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  rm-sqlserver-data:
