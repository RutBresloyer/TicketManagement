# Static hosting for the Angular build. The browser calls the API directly on http://localhost:5080
# (allowed by the API's CORS policy for http://localhost:4200).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Defined once at server level: nginx drops inherited add_header values in any location that sets its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' for styles only: Angular injects component styles as <style> elements.
    # Scripts are 'self' only, which is why critical-CSS inlining (an inline <script>) is disabled in angular.json.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:5080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
